name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

# Both jobs read the Node version from .nvmrc, so there is one place to change it.
# No secrets are needed by any step.

jobs:
  rules:
    name: Project rules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: Rule checker and guard tests
        run: node --test scripts/*.test.mjs
      - name: Check the repository against the build guide's rules
        run: node scripts/check-rules.mjs

  app:
    name: App (lint, typecheck, rules, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install exact dependencies from package-lock.json
        run: npm ci
      - name: Lint, typecheck, rule checks and their tests
        run: npm run check
      - name: Production build
        run: npm run build
      # Builds the Cloudflare worker locally (no deploy, no Cloudflare login or
      # secrets). Proves every push still works on Cloudflare (T0.5).
      # It runs `next build` again inside the adapter on purpose: the step above
      # proves Next.js builds, this one proves the worker packaging.
      - name: Cloudflare build (OpenNext adapter)
        run: npx opennextjs-cloudflare build
        env:
          WRANGLER_SEND_METRICS: "false"
      # Unit tests (Vitest) run inside `npm run check`. Browser tests
      # (Playwright) run in the e2e job below. Later stages add:
      # supabase test db (Stage 2+).

  e2e:
    name: Browser tests (Playwright, phone and desktop)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install exact dependencies from package-lock.json
        run: npm ci
      # Downloads the Chromium build that matches the pinned @playwright/test
      # version, plus the Linux libraries it needs.
      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium
      # Builds and starts the production app (webServer in
      # playwright.config.ts), then runs every test at phone and desktop size.
      - name: Run browser tests
        run: npm run test:e2e
      - name: Upload the Playwright HTML report
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
